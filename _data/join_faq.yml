- question: Who can join?
  answer: Young adults in or near Bangalore who care about service and leadership - students and working professionals alike. Rotaract is generally for ages 18-30. If you’re unsure whether you fit, just write to us.
- question: Do I need prior Rotaract experience?
  answer: No - newcomers and continuing Rotaractors are both welcome. The form adapts to whichever you are.
- question: What happens after I apply?
  answer: Our membership team reads every application and gets in touch, usually within a week. Next steps are normally an invitation to meet the club at a meeting or project.
- question: Why do you ask for my date of birth and area?
  answer: Date of birth is only to confirm Rotaract age eligibility, and your area tells us you’re in or near Bangalore. We ask for your full address only after you join.
- question: Who sees my application?
  answer: Only the club’s membership team. Applications are never published or shared outside the club.
