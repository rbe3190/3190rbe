<article class="card card-lift group flex flex-col">
  <a href="{{ post.url | relative_url }}" class="block aspect-[16/10] overflow-hidden bg-surface-container">
    {% if post.image %}
    <img src="{{ post.image | relative_url }}" alt="" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105" loading="lazy" width="750" height="420">
    {% endif %}
  </a>
  <div class="p-5 flex flex-col flex-1">
    <p class="label-caps mb-2">News</p>
    <p class="text-metadata text-on-surface-variant mb-2">{{ post.date | date: '%b %d, %Y' }}</p>
    <h3 class="font-display text-lg font-semibold text-on-surface mb-2">
      <a href="{{ post.url | relative_url }}" class="hover:text-primary">{{ post.title }}</a>
    </h3>
    {% if post.description %}
    <p class="text-sm text-on-surface-variant line-clamp-3 mb-4 flex-1">{{ post.description | strip_html | truncate: 120 }}</p>
    {% else %}
    <div class="flex-1"></div>
    {% endif %}
    <a href="{{ post.url | relative_url }}" class="text-metadata text-primary font-bold uppercase tracking-wider mt-auto inline-flex items-center gap-1 group-hover:gap-2 transition-all">
      Learn more <span aria-hidden="true">→</span>
    </a>
  </div>
</article>
