<div id="search-overlay" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true" aria-labelledby="search-overlay-title">
  <div class="absolute inset-0 bg-inverse-surface/70 backdrop-blur-sm" data-search-close tabindex="-1" aria-hidden="true"></div>
  <div class="relative mx-auto mt-[12vh] w-full max-w-lg px-4">
    <div class="rounded-lg bg-surface shadow-lift border border-outline-variant/40 p-5 md:p-6">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div>
          <p class="label-caps mb-1" id="search-overlay-title">Search</p>
          <p class="text-sm text-on-surface-variant">News, events, causes, and pages</p>
        </div>
        <button type="button" class="touch-target text-on-surface-variant hover:text-primary" data-search-close aria-label="Close search">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
      </div>
      <form action="{{ '/search' | relative_url }}" method="get" role="search">
        <label for="search-overlay-q" class="sr-only">Search the site</label>
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            id="search-overlay-q"
            type="search"
            name="q"
            placeholder="What are you looking for?"
            required
            autocomplete="off"
            class="flex-1 min-w-0 rounded border border-outline-variant bg-surface-container-lowest px-4 py-3 text-on-surface focus:outline-none focus:ring-2 focus:ring-primary"
          >
          <button type="submit" class="btn btn-primary touch-target shrink-0">Search</button>
        </div>
      </form>
      <p class="text-xs text-on-surface-variant mt-3">Press <kbd class="px-1 border border-outline-variant rounded">Esc</kbd> to close</p>
    </div>
  </div>
</div>
