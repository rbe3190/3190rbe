{% if paginator.total_pages > 1 %}
<nav class="mt-12 flex justify-center gap-2" aria-label="Pagination">
  {% if paginator.previous_page %}
  <a href="{{ paginator.previous_page_path | relative_url }}" class="btn btn-outline text-sm py-2">Previous</a>
  {% endif %}
  <span class="inline-flex items-center px-4 text-sm text-on-surface-variant">
    Page {{ paginator.page }} of {{ paginator.total_pages }}
  </span>
  {% if paginator.next_page %}
  <a href="{{ paginator.next_page_path | relative_url }}" class="btn btn-outline text-sm py-2">Next</a>
  {% endif %}
</nav>
{% endif %}
