# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: rotaractblreast/RBEwebsite
  branch: master
  auth_methods: [oauth]
  # Omit base_url / auth_endpoint — Netlify OAuth defaults (api.netlify.com/auth).

# Search uses Sveltia client-side indexing over loaded entries (not Decap GitHub API search).
search: false

# Direct publish to master (no CMS draft/PR workflow).

media_folder: "images/uploads/" # Folder where user uploaded files should go
site_url: https://rotaractblreast.org/
display_url: rotaractblreast.org
logo_url: https://rotaractblreast.org/images/site/rbe.png

collections: # A list of collections the CMS should be able to edit 
  - label: "Causes"
    name: "causes"
    folder: "_causes"
    create: true # Allow users to create new documents in this collection
    sortable_fields: ['title','due','active','progress','featured']
    slug: "{{slug}}"
    fields: # The fields each document in this collection have
      - {label: "Layout", name: "layout", widget: "hidden", default: "cause"}
      - {label: "Focus", name: "focus", widget: "string"}
      - {label: "Cause Title", name: "title", widget: "string"}
      - {label: "Image (Dimension: 750*420 px) (File Name: cause_2223abc...)", name: "image", widget: "image"} 
      - {label: "Due Date", name: "due", widget: "date", format: "YYYY-MM-DD", required: false}
      - {label: "Cause Status: Active?", name: "active", widget: "boolean", default: true}
      - {label: "Fundraise Goal", name: "goal", widget: "string"}
      - label: "Fundraise Progress"
        name: "progress"
        widget: "number"
        default: 0
        value_type: "int"
        min: 0
        max: 100
        step: 1
      - {label: "Featured Cause? (optional; site prioritizes active + recency)", name: "featured", widget: "boolean", default: false}
      - {label: "Donation Link", name: "donation_link", widget: "string"}
      - {label: "Introduction", name: "intro", widget: "markdown"}
      - {label: "Meta Description", name: "description", widget: "markdown"}
      - {label: "Cause Details", name: "body", widget: "markdown", required: false}
  - label: "Events"
    name: "events"
    folder: "_events"
    create: true # Allow users to create new documents in this collection
    sortable_fields: ['title','start','end']
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: # The fields each document in this collection have
      - {label: "Layout", name: "layout", widget: "hidden", default: "event"}
      - {label: "Event Title", name: "title", widget: "string"}
      - label: "Start time"
        name: "start"
        widget: "datetime"
        date_format: "YYYY-MM-DD" 
        time_format: "HH:mm"
        format: "YYYY-MM-DD HH:mm"
        picker_utc: false
      - label: "End time (required for multi-day / ongoing events)"
        name: "end"
        widget: "datetime"
        date_format: "YYYY-MM-DD" 
        time_format: "HH:mm"
        format: "YYYY-MM-DD HH:mm"
        picker_utc: false
        required: false
        hint: "Set an accurate end. If omitted, the event becomes Past as soon as Start passes."
      - {label: "Author", name: "author", widget: "hidden", default: "rbe"}
      - {label: "Venue", name: "venue", widget: "string"}
      - {label: "Button Open?", name: "button_open", widget: "boolean", default: true}
      - {label: "Button Text", name: "button_text", widget: "string"}
      - {label: "Button Url", name: "button_url", widget: "string"}
      - {label: "Image (Dimension: 750*420 px) (File Name: event_2223abc...)", name: "image", widget: "image"}
      - {label: "Introduction", name: "intro", widget: "markdown"}
      - {label: "Meta Description", name: "description", widget: "markdown"}
      - {label: "Event Details", name: "body", widget: "markdown", required: false}
  - label: "News"
    name: "news"
    folder: "_posts"
    create: true # Allow users to create new documents in this collection
    sortable_fields: ['title','date']
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields: # The fields each document in this collection have
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD"}
      - {label: "Image (Dimension: 750*420 px) (File Name: 2223abc...)", name: "image", widget: "image"}
      - {label: "Author", name: "author", widget: "hidden", default: "rbe"}
      - label: "Avenues"
        name: "categories"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Club Service", value: "Club-Service" }
          - { label: "Community Service", value: "Community-Service" }
          - { label: "International Service", value: "International-Service" }
          - { label: "Professional Development", value: "Professional-Development" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        default: ["hosting", "participating", "volunteering"]
        required: false
      - label: Comments
        name: "comments"
        widget: list
        required: false
        fields:
          - {label: "Name of User", name: "user", widget: "string"}   
          - label: "Comment Time"
            name: "timestamp"
            widget: "datetime"
            date_format: "YYYY-MM-DD" 
            time_format: "HH:mm:ss"
            format: "YYYY-MM-DD HH:mm:ss"
            picker_utc: false
          - {label: "Comment", name: "comment", widget: "markdown"}
      - {label: "Description", name: "description", widget: "markdown"}
      - {label: "Body", name: "body", widget: "markdown", required: false}
  - label: "Team"
    name: "team"
    files:
      - label: "Rotaract Bangalore East | Team"
        name: "team"
        file: "_data/team.yml"
        media_folder: "/images/team"
        public_folder: "/images/team"
        fields:
          - label: Team Members
            name: members
            widget: list
            fields:
              - {label: "Name", name: "name", widget: "string", default: ""}
              - {label: "Role / designation", name: "role", widget: "string", default: ""}
              - {label: "Member since", name: "member_since", widget: "string", default: "", required: false, hint: "Year only (2020) or full date (19 July 2019)"}
              - label: Social Media Links
                name: social
                widget: object
                fields:
                  - {label: "Linkedin Profile Link", name: "linkedin", widget: "string", default: "", required: false}
                  - {label: "Twitter Handle Link", name: "twitter", widget: "string", default: "", required: false}
                  - {label: "Facebook Profile Link", name: "facebook", widget: "string", default: "", required: false}
                  - {label: "Instagram Profile Link", name: "instagram", widget: "string", default: "", required: false}
                  - {label: "Email ID", name: "email", widget: "string", default: "", required: false}
              - {label: "Featured Profile Link", name: "featurelink", widget: "string", default: "", required: false}
              - {label: "Image (Dimension: 420*420 px) (File Name: First Name)", name: "image", widget: "image"}
  - label: "Brand Kit"
    name: "brandkit"
    files:
      - label: "Brand Kit groups & assets"
        name: "brandkit"
        file: "_data/brandkit.yml"
        media_folder: "images/brandkit"
        public_folder: "/images/brandkit"
        fields:
          - label: "Brand families / groups"
            name: "groups"
            widget: "list"
            summary: "{{fields.group_name}}"
            fields:
              - {label: "Group name", name: "group_name", widget: "string"}
              - label: "Assets in this group"
                name: "items_list"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Description", name: "description", widget: "string"}
                  - {label: "Preview image", name: "preview", widget: "image"}
                  - {label: "Download file", name: "file", widget: "image"}
                  - {label: "Needs dark preview background?", name: "white", widget: "boolean", default: false, required: false, hint: "On for white/light logos so they show on a dark swatch"}
