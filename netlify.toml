[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Sanity is the content source of truth. Unset / omit USE_FS_CONTENT (do not set to "1").
  # Both values are public (they ship in the client bundle), so pin them here rather than
  # relying on site env vars — a missing project id fails the build.
  PUBLIC_SANITY_PROJECT_ID = "t6bu0f9m"
  PUBLIC_SANITY_DATASET = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "0"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Critical host / path redirects only.
# Do NOT add trailing-slash canonicals like /about → /about/: with force=true,
# Netlify matches both /about and /about/ and loops (ERR_TOO_MANY_REDIRECTS).
# Astro trailingSlash: "always" already emits .../index.html; Netlify serves /about/ natively.

[[redirects]]
  from = "https://rotaractblreast.netlify.com/*"
  to = "https://rotaractblreast.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/feed.xml"
  to = "/rss.xml"
  status = 301
