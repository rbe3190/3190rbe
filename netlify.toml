[build]
  command = "npm ci && npm run build:css && bundle install && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.2.2"
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "0"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Primary domain + legacy CMS path
[[redirects]]
  from = "https://rotaractblreast.netlify.com/*"
  to = "https://rotaractblreast.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://3191rbe.org/*"
  to = "https://rotaractblreast.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/teamadmin"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/teamadmin/"
  to = "/admin/"
  status = 301
  force = true

[[redirects]]
  from = "/teamadmin/*"
  to = "/admin/:splat"
  status = 301
  force = true
